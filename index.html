<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script

  <body class="flex items-start w-full">

      <h1 class="hidden">Home</h1>

      <a href="/auth/login/" id="login-btn">Login</a>

    <main class="w-5/6 flex flex-col gap-3 items-center my-3 bg-white">
      <a
        href="/post/create/index.html"
        class="flex justify-center items-center bg-orange-700 hover:bg-orange-300 text-white rounded-full w-5 h-5"

      <div
        id="social-posts"

      ></div>
