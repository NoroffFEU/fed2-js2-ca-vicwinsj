<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <header>
      <a href="../../index.html">
        <img src="../../public/images/noroff-logo.png" alt="Noroff Logo" />
      </a>

      <h1>Home</h1>
      <a href="/profile/" id="profile-btn">My Profile</a>
      <a href="/auth/login/" id="login-btn">Login</a>
      <a href="/auth/register/" id="register-btn">Register</a>
      <button id="logout-btn">Logout</button>
    </header>
    <h1>Create Post</h1>

    <form name="createPost">
      <div>
        <!-- <label for="create-body">Body</label> -->
        <textarea id="create-body" name="body" placeholder="What's on your mind?" required></textarea>
      </div>
      <div>
        <div>
          <!-- <label for="create-img-url">Image url</label> -->
          <input type="url" id="create-img-url" name="image-url"></input>
        </div>
        <div>
          <label for="create-img-alt">Image description</label>
          <input id="create-img-alt" name="alt-text"></input>
        </div>
        </div>
      <button type="submit" id="create">Create Post</button>
    </form>
  </body>
</html>
