<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Post | Chat Cat</title>
    <script type="module" crossorigin src="/fed2-js2-ca-vicwinsj/assets/app-BC7znxY2.js"></script>
    <link rel="stylesheet" crossorigin href="/fed2-js2-ca-vicwinsj/assets/app-DSvw9Wel.css">
  </head>

  <body class="flex flex-col-reverse lg:flex-row items-start w-full">
    <header
      class="bg-orange-700 text-white p-3 lg:w-1/6 w-screen h-8 lg:h-screen lg:sticky flex lg:flex-col gap-3 items-center justify-center fixed top-0"
    >
      <a href="/">
        <img class="w-10" src="/fed2-js2-ca-vicwinsj/images/chat-cat-logo.svg" alt="Chat Cat Logo" />
      </a>
      <div
        class="bg-orange-700 text-white p-3 lg:w-1/6 w-screen h-20 lg:h-screen lg:top-0 flex lg:flex-col gap-3 items-center justify-center lg:sticky lg:left-0 fixed bottom-0"
      >
        <a class="flex flex-col gap-1" href="/" class=""
          ><i class="fa-solid fa-house"></i
          ><span class="lg:block hidden">Home</span></a
        >
        <a class="flex flex-col gap-1" href="/profile/" id="profile-btn"
          ><i class="fa-solid fa-user"></i
          ><span class="hidden lg:block">Profile</span></a
        >
        <a href="/auth/login/" id="login-btn">Login</a>
        <a href="/auth/register/" id="register-btn">Register</a>
        <button id="logout-btn">
          <i class="fa-solid fa-right-from-bracket">Logout</i>
        </button>
      </div>
    </header>
    <aside
      class="w-screen lg:w-5/6 flex flex-col mt-10 gap-3 items-center my-3 bg-white"
    >
      <h1 class="hidden">Edit Post</h1>
      <form
        name="editPost"
        class="w-1/2 flex flex-col gap-3 p-3 bg-black rounded-xl"
      >
        <div>
          <label for="edit-body">Body</label>
          <textarea
            class="w-full resize-none border-solid border-2 border-black text-black bg-white px-3 py-1"
            id="edit-body"
            name="body"
            placeholder="What's on your mind?"
            required
          ></textarea>
        </div>
        <details>
          <summary
            class="flex items-center gap-3 font-bold text-white hover:text-gray-300 cursor-pointer"
          >
            <i class="fa-regular fa-image"></i><span>Edit or add image</span>
          </summary>
          <div>
            <img id="edit-img" src="" alt="" />
          </div>
          <div>
            <label for="edit-img-url text-white">Image url</label>
            <input
              class="w-full px-3 py-1"
              type="url"
              id="edit-img-url"
              name="image-url"
              placeholder="Image URL"
            />
          </div>
        </details>
        <button class="btn" type="submit" value="update" id="update">
          Update Post
        </button>
        <button class="btn btn-red" type="submit" value="delete" id="delete">
          Delete Post
        </button>
        <div id=""></div>
      </form>
    </aside>
  </body>
</html>
