<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body class="flex items-start w-full">
    <header
      class="bg-orange-700 text-white p-3 w-1/6 h-screen sticky top-0 flex flex-col gap-1 items-center justify-center"
    >
      <a href="/">
        <img src="/images/noroff-logo.png" alt="Noroff Logo" />
      </a>

      <h1>Home</h1>
      <a href="/profile/" id="profile-btn">My Profile</a>
      <a href="/auth/login/" id="login-btn">Login</a>
      <a href="/auth/register/" id="register-btn">Register</a>
      <button id="logout-btn">Logout</button>
    </header>
    <aside class="w-5/6 flex flex-col gap-3 items-center my-3 bg-white">
      <h1>Edit Post</h1>
      <form
        name="editPost"
        class="w-1/2 flex flex-col gap-3 p-3 bg-black rounded-xl"
      >
        <label for="edit-title">Title</label>
        <input
          class="border-solid border-2 border-black text-black rounded-xl bg-white p-3"
          id="edit-title"
          name="title"
          placeholder="Title"
        />
        <div>
          <label for="edit-body">Body</label>
          <textarea
            class="w-full resize-none border-solid border-2 border-black text-black rounded-xl bg-white p-3"
            id="edit-body"
            name="body"
            required
          ></textarea>
        </div>
        <details>
          <summary class="font-bold text-white cursor-pointer">
            Edit/add image
          </summary>
          <div>
            <img id="edit-img" src="" alt="" />
          </div>
          <!-- <button class="btn" type="submit" value="update" id="update">
            Edit image
          </button> -->
          <div>
            <label for="edit-img-url">Image url</label>
            <input
              class="w-full rounded-xl p-3"
              type="url"
              id="edit-img-url"
              name="image-url"
              placeholder="Image URL"
            />
          </div>
          <!-- <div>
            <label for="edit-img-alt">Image description</label>
            <input id="edit-img-alt" name="alt-text" />
          </div> -->
        </details>
        <button class="btn" type="submit" value="update" id="update">
          Update Post
        </button>
        <button class="btn" type="submit" value="delete" id="delete">
          Delete Post
        </button>
      </form>
    </aside>
  </body>
</html>
