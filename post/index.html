<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Cat</title>
    <script type="module" crossorigin src="/fed2-js2-ca-vicwinsj/assets/app-YRR1fNSi.js"></script>
    <link rel="stylesheet" crossorigin href="/fed2-js2-ca-vicwinsj/assets/app-DSvw9Wel.css">
  </head>
  <body class="flex flex-col-reverse lg:flex-row items-start w-full">
    <header
      class="bg-orange-700 text-white p-3 lg:w-1/6 w-screen h-8 lg:h-screen lg:sticky flex lg:flex-col gap-3 items-center justify-center fixed top-0"
    >
      <a href="/">
        <img class="w-10" src="/fed2-js2-ca-vicwinsj/images/chat-cat-logo.svg" alt="Chat Cat Logo" />
      </a>
      <div
        class="bg-orange-700 text-white p-3 lg:w-1/6 w-screen h-20 lg:h-screen lg:top-0 flex lg:flex-col gap-3 items-center justify-center lg:sticky lg:left-0 fixed bottom-0"
      >
        <a class="flex flex-col gap-1" href="/" class=""
          ><i class="fa-solid fa-house"></i
          ><span class="lg:block hidden">Home</span></a
        >
        <a class="flex flex-col gap-1" href="/profile/" id="profile-btn"
          ><i class="fa-solid fa-user"></i
          ><span class="hidden lg:block">Profile</span></a
        >
        <a href="/auth/login/" id="login-btn">Login</a>
        <a href="/auth/register/" id="register-btn">Register</a>
        <button id="logout-btn">
          <i class="fa-solid fa-right-from-bracket">Logout</i>
        </button>
      </div>
    </header>
    <aside
      class="bg-white w-screen lg:w-5/6 mt-10 flex flex-col mt-3 gap-3 items-center h-screen"
    >
      <h1 class="hidden">Post Page</h1>
      <article
        class="w-1/2 rounded-xl flex flex-col gap-3 p-3 bg-black text-white"
      >
        <div class="flex justify-between gap-3">
          <div class="flex items-center">
            <p id="post-author"></p>
            <p id="post-date"></p>
          </div>
          <a class="btn" href="" id="edit-btn">Edit</a>
        </div>
        <p id="post-body"></p>
        <div class="w-full max-h-96 overflow-hidden">
          <img class="w-full object-contain" src="" alt="" id="post-img" />
        </div>
        <div class="flex gap-3" id="reply">
          <textarea
            class="z-10 w-full bg-black text-white resize-none p-3 border-0 box-border"
            placeholder="Reply here"
          ></textarea>
          <button class="btn border-0 box-border" id="comment-btn">Post</button>
        </div>
        <div id="comments"></div>
      </article>
      <!-- <div id="tags"></div> -->
    </aside>
  </body>
</html>
