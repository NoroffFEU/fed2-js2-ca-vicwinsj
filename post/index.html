<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="flex items-start w-full">
    <header
      class="bg-orange-700 text-white p-3 w-1/6 h-screen sticky top-0 flex flex-col gap-1 items-center justify-center"
    >
      <a href="/">
        <img src="/images/noroff-logo.png" alt="Noroff Logo" />
      </a>

      <h1>Home</h1>
      <a href="/profile/" id="profile-btn">My Profile</a>
      <a href="/auth/login/" id="login-btn">Login</a>
      <a href="/auth/register/" id="register-btn">Register</a>
      <button id="logout-btn">Logout</button>
    </header>
    <aside class="bg-white w-5/6 flex flex-col gap-3 items-center h-screen">
      <h1>Post Page</h1>
      <!-- <h2 id="post-heading"></h2> -->
      <article
        class="w-1/2 rounded-xl flex flex-col gap-3 p-3 bg-black text-white"
      >
        <div class="flex justify-between gap-3">
          <div class="flex items-center">
            <p id="post-author"></p>
            <p id="post-date"></p>
          </div>
          <a class="btn" href="" id="edit-btn">Edit</a>
        </div>
        <p id="post-body"></p>
        <div class="w-full max-h-96 overflow-hidden">
          <img class="w-full object-contain" src="" alt="" id="post-img" />
        </div>
      </article>
      <!-- <div id="tags"></div> -->
    </aside>
  </body>
</html>
