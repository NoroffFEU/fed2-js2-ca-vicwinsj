<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Chat Cat</title>
    <script type="module" crossorigin src="/fed2-js2-ca-vicwinsj/assets/app-YRR1fNSi.js"></script>
    <link rel="stylesheet" crossorigin href="/fed2-js2-ca-vicwinsj/assets/app-DSvw9Wel.css">
  </head>

  <body class="flex flex-col-reverse lg:flex-row items-start w-full"></body>
    <header
      class="bg-orange-700 text-white p-3 lg:w-1/6 w-screen h-8 lg:h-screen lg:sticky flex lg:flex-col gap-3 items-center justify-center fixed top-0"
    >
      <a href="/">
        <img class="w-10" src="/fed2-js2-ca-vicwinsj/images/chat-cat-logo.svg" alt="Chat Cat Logo" />
      </a>
      <div
        class="bg-orange-700 text-white p-3 lg:w-1/6 w-screen h-20 lg:h-screen lg:top-0 flex lg:flex-col gap-3 items-center justify-center lg:sticky lg:left-0 fixed bottom-0"
      >
        <a href="/" class=""><i class="fa-solid fa-house">Home</i></a>
        <a href="/profile/" id="profile-btn"
          ><i class="fa-solid fa-user">My Profile</i></a
        >
        <a href="/auth/login/" id="login-btn">Login</a>
        <a href="/auth/register/" id="register-btn">Register</a>
        <button id="logout-btn">
          <i class="fa-solid fa-right-from-bracket">Logout</i>
        </button>
      </div>
    </header>
    <main class="text-white w-5/6 flex flex-col items-center justify-center">
      <h1>Register</h1>
      <form
  id="register-form"
  name="register"
  class="flex flex-col items-center gap-3 p-3 w-1/2 bg-black text-white rounded-xl"
>
  <div class="flex flex-col items-end gap-3 text-black">
    <div class="flex gap-3">
      <label for="name" class="text-white">Name</label>
      <input
        class="px-3 text-black"
        id="register-name"
        type="text"
        name="name"
        required
        maxlength="20"
        pattern="^[\w]+$"
        title="Please enter a username using only letters and numbers"
      />
    </div>
    <div class="flex gap-3">
      <label for="email" class="text-white">Email</label>
      <input
        class="px-3 text-black"
        id="register-email"
        type="email"
        name="email"
        required
        pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
        title="Please enter a valid noroff.no or stud.noroff.no address"
      />
    </div>
    <div class="flex gap-3">
      <label for="password" class="text-white">Password</label>
      <input
        class="px-3 text-black"
        type="password"
        name="password"
        id="register-password"
        required
        minlength="8"
      />
    </div>
  </div>
  <div class="flex items-center gap-3">
    <a href="/auth/login/">Login</a>
    <button class="btn" type="submit" id="register-button">Register</button>
  </div>
  <p id="register-error"></p>
</form>
    </main>
  </body>
</html>
